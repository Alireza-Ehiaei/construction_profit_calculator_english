name: Build iOS IPA and Upload to BrowserStack

on:
  workflow_dispatch:

jobs:
  build-and-upload-to-browserstack:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter setup
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingCertificate</key>
            <string>Apple Development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tech4dev.constructionprofitcalculator</key>
              <string>ConstructionProfitCalculatorDevelopmentProfile</string>
            </dict>
            <key>teamID</key>
            <string>AHVM2Z8TDL</string>
          </dict>
          </plist>
          EOL

      - name: Setup Code Signing
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Verify secrets are not empty
          if [ -z "$SIGNING_CERTIFICATE_P12" ]; then
            echo "Error: SIGNING_CERTIFICATE_P12 is empty"
            exit 1
          fi
          if [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "Error: CERTIFICATE_PASSWORD is empty"
            exit 1
          fi
          if [ -z "$PROVISIONING_PROFILE" ]; then
            echo "Error: PROVISIONING_PROFILE is empty"
            exit 1
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Error: KEYCHAIN_PASSWORD is empty"
            exit 1
          fi
          
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          
          # Import signing certificate
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "Error: certificate.p12 is empty or invalid"
            exit 1
          fi
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep "AHVM2Z8TDL" || { echo "Certificate import failed"; exit 1; }
          
          # Install provisioning profile
          echo "$PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          if [ ! -s profile.mobileprovision ]; then
            echo "Error: profile.mobileprovision is empty or invalid"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ConstructionProfitCalculatorDevelopmentProfile.mobileprovision
          echo "Provisioning profile installed successfully"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="Apple Development"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="ConstructionProfitCalculatorDevelopmentProfile"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --verbose > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          mkdir -p ipa-artifact
          cp build/ios/ipa/*.ipa ipa-artifact/app.ipa

      - name: Upload IPA to BrowserStack
        id: browserstack-upload
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          echo "Uploading IPA to BrowserStack App Live..."
          APP_URL=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-live/upload" \
            -F "file=@ipa-artifact/app.ipa" \
            --silent | jq -r '.app_url')

          if [ -z "$APP_URL" ] || [ "$APP_URL" == "null" ]; then
            echo "Error: Failed to upload IPA to BrowserStack"
            exit 1
          fi

          echo "App uploaded successfully. BrowserStack URL: $APP_URL"
          
          echo "Launching iOS device on BrowserStack..."
          SESSION_RESPONSE=$(curl -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-live/launch" \
            -H "Content-Type: application/json" \
            -d '{
              "app": "'$APP_URL'",
              "devices": ["iPhone 16 Plus", "iPhone 16", "iPhone 15 Pro"],
              "deviceLogs": true,
              "local": false
            }' \
            --silent)

          SESSION_URL="https://app-live.browserstack.com/sessions/$(echo $SESSION_RESPONSE | jq -r '.sessionId')"

          if [ -z "$SESSION_URL" ] || [ "$SESSION_URL" == "null" ]; then
            echo "Error: Failed to create BrowserStack session"
            echo "Response: $SESSION_RESPONSE"
            exit 1
          fi

          echo "BrowserStack session created successfully!"
          echo "SESSION_URL=$SESSION_URL" >> $GITHUB_OUTPUT

      - name: Display BrowserStack Session URL and Testing Instructions
        run: |
          echo "🎉 BrowserStack Testing Session Ready!"
          echo "👉 Click this link to start testing: ${{ steps.browserstack-upload.outputs.SESSION_URL }}"
          echo ""
          echo "📝 TESTING INSTRUCTIONS FOR IAP:"
          echo "1. Click the link above to open the iOS device in your browser"
          echo "2. On the device, go to Settings > App Store"
          echo "3. LOG OUT of any existing account (tap your profile, then Sign Out)"
          echo "4. LOG IN with your SANDBOX TESTER account:"
          echo "   Email: sandboxuser1@cpce.com"
          echo "   Password: [your_sandbox_tester_password]"
          echo "   (Verify email if prompted; use a real, unused email)"
          echo "5. Return to the home screen and open your app"
          echo "6. Test the purchase flow - it will use the Sandbox environment!"
          echo ""
          echo "⚠️ Before testing IAPs, ensure:"
          echo "1. App Store Connect has active In-App Purchase products"
          echo "2. App's Bundle ID matches App Store Connect (com.tech4dev.constructionprofitcalculator)"
          echo "3. The in_app_purchase Flutter package is correctly implemented"
          echo "4. Test edge cases: interrupted purchases, restore purchases, subscriptions"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            pub_get_log.txt
            build_log.txt
            ipa-artifact/*.ipa
