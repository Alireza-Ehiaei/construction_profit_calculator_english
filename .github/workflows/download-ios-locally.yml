name: Build and Upload iOS IPA to App Store Connect
on:
  workflow_dispatch:
jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      MD_APPLE_SDK_ROOT: /Applications/Xcode.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify Xcode and SDK
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version > xcode_info.txt
          xcodebuild -showsdks >> xcode_info.txt
          xcrun simctl runtime list >> xcode_info.txt
          sudo xcodebuild -downloadPlatform ios > sdk_install_log.txt 2>&1 || { cat sdk_install_log.txt; exit 1; }
          xcodebuild -showsdks >> sdk_install_log.txt
        env:
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
          cache: true
        env:
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

      - name: Verify Flutter version
        run: |
          echo "Verifying Flutter version 3.29.3"
          flutter --version > flutter_version_log.txt 2>&1 || { cat flutter_version_log.txt; exit 1; }

      - name: Install dependencies
        run: flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Flutter clean
        run: flutter clean

      - name: Generate Flutter iOS config
        run: |
          flutter build ios --config-only --no-codesign --verbose > flutter_config_log.txt 2>&1 || { cat flutter_config_log.txt; exit 1; }
          ls -l ios/Flutter/

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Update iOS deployment target
        run: |
          set -e
          echo "Updating iOS deployment target to 16.0"
          if [ ! -f "ios/Podfile" ]; then
            echo "❌ Podfile missing, creating default Flutter Podfile"
            echo "platform :ios, '16.0'" > ios/Podfile
            echo "install! 'cocoapods', :deterministic_uuids => false" >> ios/Podfile
            echo "target 'Runner' do" >> ios/Podfile
            echo "  use_frameworks!" >> ios/Podfile
            echo "  use_modular_headers!" >> ios/Podfile
            echo "  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))" >> ios/Podfile
            echo "end" >> ios/Podfile
            echo "post_install do |installer|" >> ios/Podfile
            echo "  installer.pods_project.targets.each do |target|" >> ios/Podfile
            echo "    flutter_additional_ios_build_settings(target)" >> ios/Podfile
            echo "    target.build_configurations.each do |config|" >> ios/Podfile
            echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'" >> ios/Podfile
            echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''" >> ios/Podfile
            echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> ios/Podfile
            echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> ios/Podfile
            echo "    end" >> ios/Podfile
            echo "  end" >> ios/Podfile
            echo "end" >> ios/Podfile
          else
            sed -i '' "s/platform :ios, '.*'/platform :ios, '16.0'/" ios/Podfile
            if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET.*=.*'16.0'" ios/Podfile; then
              echo "Adding or updating IPHONEOS_DEPLOYMENT_TARGET in post_install block"
              if grep -q "post_install do |installer|" ios/Podfile; then
                sed -i '' "/flutter_additional_ios_build_settings(target)/a\\
                target.build_configurations.each do |config|\\
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'\\
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''\\
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\\
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\\
                end" ios/Podfile
              else
                echo "post_install do |installer|" >> ios/Podfile
                echo "  installer.pods_project.targets.each do |target|" >> ios/Podfile
                echo "    flutter_additional_ios_build_settings(target)" >> ios/Podfile
                echo "    target.build_configurations.each do |config|" >> ios/Podfile
                echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'" >> ios/Podfile
                echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''" >> ios/Podfile
                echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> ios/Podfile
                echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> ios/Podfile
                echo "    end" >> ios/Podfile
                echo "  end" >> ios/Podfile
                echo "end" >> ios/Podfile
              fi
            fi
          fi
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9]*\.[0-9][0-9]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/' ios/Runner.xcodeproj/project.pbxproj
          plutil -replace MinimumOSVersion -string "16.0" ios/Runner/Info.plist
          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" ios/Runner/Info.plist >/dev/null 2>&1; then
            echo "✅ CFBundleIconName exists in Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" ios/Runner/Info.plist
          else
            echo "Adding CFBundleIconName to Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" ios/Runner/Info.plist
          fi
          echo "Podfile content:"
          cat ios/Podfile
          echo "project.pbxproj IPHONEOS_DEPLOYMENT_TARGET:"
          grep IPHONEOS_DEPLOYMENT_TARGET ios/Runner.xcodeproj/project.pbxproj
          echo "Info.plist MinimumOSVersion and CFBundleIconName:"
          plutil -p ios/Runner/Info.plist | grep -E "MinimumOSVersion|CFBundleIconName"
          
      - name: Configure Xcode manual signing
        run: |
          set -e
          gem install xcodeproj
          echo "require 'xcodeproj'" > fix_signing.rb
          echo "project = Xcodeproj::Project.open('ios/Runner.xcodeproj')" >> fix_signing.rb
          echo "project.targets.each do |target|" >> fix_signing.rb
          echo "  target.build_configurations.each do |config|" >> fix_signing.rb
          echo "    config.build_settings['CODE_SIGN_STYLE'] = 'Manual'" >> fix_signing.rb
          echo "    config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'ConstructionProfitCalculatorProvisionProfile'" >> fix_signing.rb
          echo "    config.build_settings['DEVELOPMENT_TEAM'] = 'AHVM2Z8TDL'" >> fix_signing.rb
          echo "    config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'" >> fix_signing.rb
          echo "    config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.tech4dev.constructionprofitcalculator'" >> fix_signing.rb
          echo "  end" >> fix_signing.rb
          echo "end" >> fix_signing.rb
          echo "pods_project_path = 'ios/Pods/Pods.xcodeproj'" >> fix_signing.rb
          echo "if File.exist?(pods_project_path)" >> fix_signing.rb
          echo "  pods_project = Xcodeproj::Project.open(pods_project_path)" >> fix_signing.rb
          echo "  pods_project.targets.each do |target|" >> fix_signing.rb
          echo "    target.build_configurations.each do |config|" >> fix_signing.rb
          echo "      config.build_settings['CODE_SIGN_STYLE'] = 'Manual'" >> fix_signing.rb
          echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> fix_signing.rb
          echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> fix_signing.rb
          echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''" >> fix_signing.rb
          echo "    end" >> fix_signing.rb
          echo "  end" >> fix_signing.rb
          echo "  pods_project.save" >> fix_signing.rb
          echo "end" >> fix_signing.rb
          echo "project.save" >> fix_signing.rb
          ruby fix_signing.rb
          echo "Updated project and Pods signing settings"
          
      - name: Validate bundle identifier
        run: |
          cd ios
          echo "=== Debugging PRODUCT_BUNDLE_IDENTIFIER in project.pbxproj ==="
          grep -C 2 "PRODUCT_BUNDLE_IDENTIFIER" Runner.xcodeproj/project.pbxproj > bundle_id_debug.txt
          cat bundle_id_debug.txt
          BUNDLE_ID=$(grep "PRODUCT_BUNDLE_IDENTIFIER = com.tech4dev.constructionprofitcalculator;" Runner.xcodeproj/project.pbxproj | head -n 1 | sed 's/.*PRODUCT_BUNDLE_IDENTIFIER = \([^;]*\);/\1/' | tr -d ' \t')
          echo "Bundle ID from project.pbxproj: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.tech4dev.constructionprofitcalculator" ]; then
            echo "Error: Bundle ID in project.pbxproj ($BUNDLE_ID) does not match expected com.tech4dev.constructionprofitcalculator"
            exit 1
          fi
          cd ..

      - name: Generate ExportOptions.plist
        run: |
          cd ios
          cat > ExportOptions.plist << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tech4dev.constructionprofitcalculator</key>
              <string>ConstructionProfitCalculatorProvisionProfile</string>
            </dict>
            <key>teamID</key>
            <string>AHVM2Z8TDL</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>none</string>
          </dict>
          </plist>
          EOL
          cd ..

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..

      - name: Clean Xcode project
        run: |
          cd ios
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos > xcode_clean_log.txt 2>&1 || { cat xcode_clean_log.txt; exit 1; }
          cd ..

      - name: Force Xcode to use available iOS SDK
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

      - name: Import Apple certificate
        env:
          IOS_DISTRIBUTION_P12_V2: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD_V2: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_P12_V2" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD_V2" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep "AHVM2Z8TDL" || { echo "Certificate import failed"; exit 1; }

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_V2: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_V2" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/f3f032ee-4fa9-4a39-8d91-f1d689df2e2c.mobileprovision
          echo "Provisioning profile installed successfully"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="ConstructionProfitCalculatorProvisionProfile"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --verbose > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa
        env:
          DEVELOPMENT_TEAM: AHVM2Z8TDL
          PROFILE_NAME: ConstructionProfitCalculatorProvisionProfile
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

     
      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            flutter_version_log.txt
            pub_get_log.txt
            xcode_info.txt
            sdk_install_log.txt
            pod_install_log.txt
            xcode_clean_log.txt
            build_log.txt
            bundle_id_debug.txt
            profile_info.plist
            fastlane_log.txt
            fastlane/report.xml
            flutter_config_log.txt
            app-ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
