name: Build and Upload iOS IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      MD_APPLE_SDK_ROOT: /Applications/Xcode.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure SceneDelegate.swift exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/SceneDelegate.swift << EOL
          import UIKit
          import Flutter

          class SceneDelegate: UIResponder, UIWindowSceneDelegate {
            var window: UIWindow?

            func scene(_ scene: UIScene, willConnectTo session: UISceneSession, options connectionOptions: UIScene.ConnectionOptions) {
              guard let windowScene = scene as? UIWindowScene else { return }
              let window = UIWindow(windowScene: windowScene)
              self.window = window
              let flutterEngine = FlutterEngine(name: "my flutter engine")
              flutterEngine.run()
              let controller = FlutterViewController(engine: flutterEngine, nibName: nil, bundle: nil)
              window.rootViewController = controller
              window.makeKeyAndVisible()
            }
          }
          EOL
          ls -l ios/Runner/SceneDelegate.swift

      - name: Ensure AppDelegate.swift exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/AppDelegate.swift << EOL
          import UIKit
          import Flutter

          @UIApplicationMain
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOL
          ls -l ios/Runner/AppDelegate.swift

      - name: Ensure Entitlements File
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/Runner.entitlements << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.in-app-payments</key>
            <array>
              <string>com.tech4dev.constructionprofitcalculator</string>
            </array>
          </dict>
          </plist>
          EOL
          ls -l ios/Runner/Runner.entitlements

      - name: Install xcodeproj gem
        run: gem install xcodeproj

      - name: Add Files to Xcode Project
        run: |
          echo "Adding SceneDelegate.swift and AppDelegate.swift to Xcode project"
          cat > add_files_to_xcode.rb << 'RUBY'
          #!/usr/bin/env ruby
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          unless target
            puts "Error: Runner target not found"
            exit 1
          end
          files = ['SceneDelegate.swift', 'AppDelegate.swift']
          group = project.main_group['Runner'] || project.main_group.new_group('Runner', 'Runner')
          files.each do |file|
            unless project.files.find { |f| f.path == file }
              file_ref = group.new_file(file)
              target.add_file_references([file_ref])
              build_phase = target.source_build_phase
              build_phase.add_file_reference(file_ref)
              puts "Added #{file} to project and build phase"
            else
              puts "#{file} already exists in project"
            end
          end
          project.save
          puts "Project saved successfully"
          RUBY
          ruby add_files_to_xcode.rb

      - name: Verify files were added to Xcode project
        run: |
          echo "Checking if files were properly added..."
          if [ -f "ios/Runner/SceneDelegate.swift" ] && [ -f "ios/Runner/AppDelegate.swift" ]; then
            echo "✓ Both Swift files exist physically"
          else
            echo "✗ Swift files missing physically"
            exit 1
          fi
          if grep -q "SceneDelegate.swift" ios/Runner.xcodeproj/project.pbxproj && \
             grep -q "AppDelegate.swift" ios/Runner.xcodeproj/project.pbxproj; then
            echo "✓ Both Swift files referenced in Xcode project"
          else
            echo "✗ Swift files missing from Xcode project"
            exit 1
          fi

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Initialize Xcode and Download iOS SDK
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          echo "Downloading iOS platform..."
          sudo xcodebuild -downloadPlatform ios -allowProvisioningUpdates > sdk_install_log.txt 2>&1 || { 
            echo "SDK download may have failed, but continuing..."
            cat sdk_install_log.txt
          }
          echo "Available SDKs:"
          xcodebuild -showsdks
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          echo "Xcode setup completed"

      - name: Verify Xcode setup
        run: |
          echo "Xcode version: $(xcodebuild -version)"
          echo "Available SDKs:"
          xcodebuild -showsdks | grep -E "(iphoneos|ios-simulator)"

      - name: Update iOS deployment target in Podfile
        run: |
          echo "Ensuring Podfile has iOS 13.0 deployment target"
          if ! grep -q "platform :ios, '13.0'" ios/Podfile; then
            echo "Updating Podfile platform to 13.0"
            sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/" ios/Podfile
          fi
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'" ios/Podfile; then
            echo "Merging IPHONEOS_DEPLOYMENT_TARGET into existing post_install block"
            sed -i '' "/post_install do |installer|/a\\
              installer.pods_project.targets.each do |target|\\
                target.build_configurations.each do |config|\\
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'\\
                end\\
              end" ios/Podfile
          fi
          grep -n "platform :ios" ios/Podfile
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile

      - name: Update Info.plist MinimumOSVersion
        run: |
          echo "Updating Info.plist MinimumOSVersion to 13.0"
          plutil -replace MinimumOSVersion -string "13.0" ios/Runner/Info.plist
          plutil -p ios/Runner/Info.plist | grep MinimumOSVersion

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
          cache: true
          cache-key: flutter-3.29.3
          cache-path: /Users/runner/hostedtoolcache/flutter

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install dependencies
        run: |
          flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Generate Flutter iOS config
        run: |
          flutter build ios --config-only --no-codesign > flutter_config_log.txt 2>&1 || { cat flutter_config_log.txt; exit 1; }
          ls -l ios/Flutter/

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..

      - name: Clean Xcode project
        run: |
          cd ios
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos > xcode_clean_log.txt 2>&1 || { cat xcode_clean_log.txt; echo "Clean failed, proceeding anyway"; }
          cd ..

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

      - name: Import Apple certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "Error: certificate.p12 is empty or invalid"
            exit 1
          fi
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep "AHVM2Z8TDL" || { echo "Certificate import failed"; exit 1; }

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_V2: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_V2" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/f3f032ee-4fa9-4a39-8d91-f1d689df2e2c.mobileprovision
          echo "Provisioning profile installed successfully"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Debug Code Signing Setup
        run: |
          echo "=== Code Signing Debug ==="
          security find-identity -v -p codesigning build.keychain
          echo "Provisioning profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Xcode version:"
          xcodebuild -version

      - name: Build IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="ConstructionProfitCalculatorProvisionProfile"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons > build_log.txt 2>&1 || { cat build_log.txt | grep -i "error:"; exit 1; }
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa
        env:
          DEVELOPMENT_TEAM: AHVM2Z8TDL
          PROFILE_NAME: ConstructionProfitCalculatorProvisionProfile
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << 'EOL'
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/construction_profit_calculator_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false
              )
            end
          end
          EOL

      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: fastlane ios upload_to_app_store_connect > fastlane_log.txt 2>&1 || { cat fastlane_log.txt | grep -i "error:"; exit 1; }

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            pub_get_log.txt
            flutter_config_log.txt
            pod_install_log.txt
            xcode_clean_log.txt
            build_log.txt
            fastlane_log.txt
            fastlane/report.xml
            app-ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
