name: Build and Upload iOS IPA to App Store Connect
on:
  workflow_dispatch:
jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      MD_APPLE_SDK_ROOT: /Applications/Xcode.app
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: AHVM2Z8TDL
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure SceneDelegate.swift exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/SceneDelegate.swift << EOL
          import UIKit
          import Flutter

          class SceneDelegate: FlutterSceneDelegate {
            override func scene(
              _ scene: UIScene,
              willConnectTo session: UISceneSession,
              options connectionOptions: UIScene.ConnectionOptions
            ) {
              guard let windowScene = scene as? UIWindowScene else { return }
              let window = UIWindow(windowScene: windowScene)
              self.window = window
              window.makeKeyAndVisible()
            }
          }
          EOL

      - name: Ensure AppDelegate.swift exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/AppDelegate.swift << EOL
          import UIKit
          import Flutter

          @UIApplicationMain
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }

            override func application(
              _ application: UIApplication,
              configurationForConnecting connectingSceneSession: UISceneSession,
              options: UIScene.ConnectionOptions
            ) -> UISceneConfiguration {
              let config = UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)
              config.delegateClass = SceneDelegate.self
              return config
            }
          }
          EOL

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify Xcode and iOS SDK
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version > xcode_info.txt
          xcodebuild -showsdks > xcode_info.txt
          xcrun simctl runtime list >> xcode_info.txt
          echo "Available SDKs before download attempt:"
          xcodebuild -showsdks
          for i in {1..3}; do
            echo "Attempt $i to download iOS SDK"
            sudo xcodebuild -downloadPlatform ios -allowProvisioningUpdates > sdk_install_log.txt 2>&1 && break
            cat sdk_install_log.txt
            sleep 5
          done
          echo "Available SDKs after download attempt:"
          xcodebuild -showsdks >> sdk_install_log.txt
          xcodebuild -showsdks | grep -E 'iphoneos18\.[0-9]+' || echo "No iOS 18.x SDK found, proceeding with latest available SDK"
        env:
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
          cache: true
        env:
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

      - name: Verify Flutter version
        run: |
          echo "Verifying Flutter version 3.29.3"
          flutter --version > flutter_version_log.txt 2>&1 || { cat flutter_version_log.txt; exit 1; }

      - name: Install dependencies
        run: flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Flutter clean
        run: flutter clean

      - name: Generate Flutter iOS config
        run: |
          flutter build ios --config-only --no-codesign > flutter_config_log.txt 2>&1 || { cat flutter_config_log.txt; exit 1; }
          ls -l ios/Flutter/

      - name: Clean DerivedData and Pods cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Pods
          rm -f ios/Podfile.lock

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..

      - name: Validate bundle identifier
        run: |
          cd ios
          echo "=== Debugging PRODUCT_BUNDLE_IDENTIFIER in project.pbxproj ==="
          grep -C 2 "PRODUCT_BUNDLE_IDENTIFIER" Runner.xcodeproj/project.pbxproj > bundle_id_debug.txt
          cat bundle_id_debug.txt
          BUNDLE_ID=$(grep "PRODUCT_BUNDLE_IDENTIFIER = com.tech4dev.constructionprofitcalculator;" Runner.xcodeproj/project.pbxproj | head -n 1 | sed 's/.*PRODUCT_BUNDLE_IDENTIFIER = \([^;]*\);/\1/' | tr -d ' \t')
          echo "Bundle ID from project.pbxproj: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.tech4dev.constructionprofitcalculator" ]; then
            echo "Error: Bundle ID in project.pbxproj ($BUNDLE_ID) does not match expected com.tech4dev.constructionprofitcalculator"
            exit 1
          fi
          cd ..

      - name: Generate ExportOptions.plist
        run: |
          cd ios
          cat > ExportOptions.plist << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tech4dev.constructionprofitcalculator</key>
              <string>ConstructionProfitCalculatorProvisionProfile</string>
            </dict>
            <key>teamID</key>
            <string>AHVM2Z8TDL</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>none</string>
          </dict>
          </plist>
          EOL
          cd ..

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_V2: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_V2" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(plutil -extract UUID xml1 -o - profile.mobileprovision | xmllint --xpath '//string/text()' -)
          echo "Installing provisioning profile with UUID: $PROFILE_UUID"
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/
      
      - name: Build IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="ConstructionProfitCalculatorProvisionProfile"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          flutter build ipa \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons > build_log.txt 2>&1 || { cat build_log.txt | grep -i "error:"; exit 1; }
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa
        env:
          DEVELOPMENT_TEAM: AHVM2Z8TDL
          PROFILE_NAME: ConstructionProfitCalculatorProvisionProfile
          MD_APPLE_SDK_ROOT: /Applications/Xcode.app

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << 'EOL'
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/construction_profit_calculator_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false
              )
            end
          end
          EOL

      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: fastlane ios upload_to_app_store_connect > fastlane_log.txt 2>&1 || { cat fastlane_log.txt | grep -i "error:"; exit 1; }

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            flutter_version_log.txt
            pub_get_log.txt
            xcode_info.txt
            sdk_install_log.txt
            pod_install_log.txt
            build_log.txt
            bundle_id_debug.txt
            fastlane_log.txt
            flutter_config_log.txt
            app-ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
