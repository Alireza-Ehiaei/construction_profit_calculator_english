name: Build and Upload iOS IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    env:
      MD_APPLE_SDK_ROOT: /Applications/Xcode.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure SceneDelegate.swift exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/SceneDelegate.swift << EOL
          import UIKit
          import Flutter
          class SceneDelegate: FlutterSceneDelegate {
            override func scene(
              _ scene: UIScene,
              willConnectTo session: UISceneSession,
              options connectionOptions: UIScene.ConnectionOptions
            ) {
              guard let windowScene = scene as? UIWindowScene else { return }
              let window = UIWindow(windowScene: windowScene)
              self.window = window
              window.makeKeyAndVisible()
            }
          }
          EOL
          ls -l ios/Runner/SceneDelegate.swift

      - name: Ensure AppDelegate.swift exists
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/AppDelegate.swift << EOL
          import UIKit
          import Flutter
          @UIApplicationMain
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
            override func application(
              _ application: UIApplication,
              configurationForConnecting connectingSceneSession: UISceneSession,
              options: UIScene.ConnectionOptions
            ) -> UISceneConfiguration {
              let config = UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)
              config.delegateClass = SceneDelegate.self
              return config
            }
          }
          EOL
          ls -l ios/Runner/AppDelegate.swift

      - name: Ensure Entitlements File
        run: |
          mkdir -p ios/Runner
          cat > ios/Runner/Runner.entitlements << EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.in-app-payments</key>
            <array>
              <string>com.tech4dev.constructionprofitcalculator</string>
            </array>
          </dict>
          </plist>
          EOL
          ls -l ios/Runner/Runner.entitlements

      - name: Install xcodeproj gem
        run: gem install xcodeproj

      - name: Add Files to Xcode Project
        run: |
          echo "Adding SceneDelegate.swift and AppDelegate.swift to Xcode project"
          cat > add_files_to_xcode.rb << 'RUBY'
          #!/usr/bin/env ruby
          
          require 'xcodeproj'
          
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          
          unless target
            puts "Error: Runner target not found"
            exit 1
          end
          
          files = ['SceneDelegate.swift', 'AppDelegate.swift']
          files.each do |file|
            unless project.files.find { |f| f.path == file }
              file_ref = project.new_file("Runner/#{file}")
              target.add_file_references([file_ref])
              puts "Added #{file} to project"
            else
              puts "#{file} already exists in project"
            end
          end
          
          project.save
          puts "Project saved successfully"
          RUBY
          
          ruby add_files_to_xcode.rb

      - name: Verify files were added to Xcode project
        run: |
          echo "Checking if files were properly added..."
          
          # Check physical existence
          if [ -f "ios/Runner/SceneDelegate.swift" ] && [ -f "ios/Runner/AppDelegate.swift" ]; then
            echo "✓ Both Swift files exist physically"
          else
            echo "✗ Swift files missing physically"
            exit 1
          fi
          
          # Check project file references
          if grep -q "SceneDelegate.swift" ios/Runner.xcodeproj/project.pbxproj && \
             grep -q "AppDelegate.swift" ios/Runner.xcodeproj/project.pbxproj; then
            echo "✓ Both Swift files referenced in Xcode project"
          else
            echo "✗ Swift files missing from Xcode project"
            exit 1
          fi

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Verify Xcode setup
        run: |
          echo "Xcode version: $(xcodebuild -version)"
          echo "Available SDKs:"
          xcodebuild -showsdks | grep -E "(iphoneos|ios-simulator)"

      - name: Update iOS deployment target in Podfile
        run: |
          echo "Ensuring Podfile has iOS 18.0 deployment target"
          
          # Check if Podfile already has the correct platform
          if ! grep -q "platform :ios, '18.0'" ios/Podfile; then
            echo "Updating Podfile platform to 18.0"
            sed -i '' "s/platform :ios, '15.0'/platform :ios, '18.0'/" ios/Podfile
          fi
          
          # Check if post_install block needs updating
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET'] = '18.0'" ios/Podfile; then
            echo "Updating post_install IPHONEOS_DEPLOYMENT_TARGET to 18.0"
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'/IPHONEOS_DEPLOYMENT_TARGET'] = '18.0'/" ios/Podfile
          fi
          
          echo "Podfile verification:"
          grep -n "platform :ios" ios/Podfile
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile

      - name: Update Info.plist MinimumOSVersion
        run: |
          echo "Updating Info.plist MinimumOSVersion to 18.0"
          plutil -replace MinimumOSVersion -string "18.0" ios/Runner/Info.plist
          echo "Info.plist MinimumOSVersion:"
          plutil -p ios/Runner/Info.plist | grep MinimumOSVersion

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
          cache: true
          cache-key: flutter-3.29.3
          cache-path: /Users/runner/hostedtoolcache/flutter

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install dependencies
        run: |
          flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Generate Flutter iOS config
        run: |
          flutter build ios --config-only --no-codesign --verbose > flutter_config_log.txt 2>&1 || { cat flutter_config_log.txt; exit 1; }
          ls -l ios/Flutter/

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..

      - name: Clean Xcode project
        run: |
          cd ios
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos > xcode_clean_log.txt 2>&1 || { cat xcode_clean_log.txt; echo "Clean failed, proceeding anyway"; }
          cd ..

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

      - name: Import Apple certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "Error: certificate.p12 is empty or invalid"
            exit 1
          fi
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain | grep "AHVM2Z8TDL" || { echo "Certificate import failed"; exit 1; }

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          if [ ! -s profile.mobileprovision ]; then
            echo "Error: profile.mobileprovision is empty or invalid"
            exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ConstructionProfitCalculatorProvisionProfile.mobileprovision
          echo "Provisioning profile installed successfully"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/ || { echo "Failed to list provisioning profiles"; exit 1; }

      - name: Debug Code Signing Setup
        run: |
          security find-identity -v -p codesigning build.keychain
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No provisioning profiles found"

      - name: Build iOS IPA
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: "Manual"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: "ConstructionProfitCalculatorProvisionProfile"
          FLUTTER_XCODE_DEVELOPMENT_TEAM: "AHVM2Z8TDL"
        run: |
          # Proper keychain setup for GitHub Actions
          security list-keychains -d user
          security list-keychains -d user -s build.keychain
          security list-keychains -d user
          
          # Set default keychain and unlock it
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          
          # Verify the keychain is properly set up
          echo "Current default keychain:"
          security default-keychain
          echo "Keychain list:"
          security list-keychains -d user
          
          # Verify code signing identity is available
          echo "Available code signing identities:"
          security find-identity -v -p codesigning build.keychain
          
          # Build the IPA
          echo "Building IPA..."
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --no-tree-shake-icons > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          
          # Copy the IPA
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa
          echo "IPA built successfully"

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << EOL
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/construction_profit_calculator_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false
              )
            end
          end
          EOL

      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: fastlane ios upload_to_app_store_connect > fastlane_log.txt 2>&1 || { cat fastlane_log.txt | grep -i "error:"; exit 1; }

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            pub_get_log.txt
            flutter_config_log.txt
            pod_install_log.txt
            xcode_clean_log.txt
            build_log.txt
            fastlane_log.txt
            fastlane/report.xml
            app-ipa/*.ipa
