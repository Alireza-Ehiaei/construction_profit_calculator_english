name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.29.3'
  IOS_DEPLOYMENT_TARGET: '13.0'

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          architecture: arm64

      - name: Set iOS deployment target
        run: |
          # 1. Update Podfile (handles both new and existing)
          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios.*/platform :ios, '${{ env.IOS_DEPLOYMENT_TARGET }}'/g" ios/Podfile ||
            echo "platform :ios, '${{ env.IOS_DEPLOYMENT_TARGET }}'" >> ios/Podfile
          else
            echo "platform :ios, '${{ env.IOS_DEPLOYMENT_TARGET }}'" > ios/Podfile
          fi

          # 2. Update Info.plist
          plutil -replace MinimumOSVersion -string "${{ env.IOS_DEPLOYMENT_TARGET }}" ios/Runner/Info.plist

          # 3. Update Xcode project (foolproof method)
          TARGET_KEY=$(xcodebuild -project ios/Runner.xcodeproj -list | awk '/Targets:/,/^$/' | grep Runner | head -1 | tr -d ' ')
          if [ -n "$TARGET_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Set :objects:$TARGET_KEY:buildSettings:IPHONEOS_DEPLOYMENT_TARGET ${{ env.IOS_DEPLOYMENT_TARGET }}" ios/Runner.xcodeproj/project.pbxproj 2>/dev/null ||
            /usr/libexec/PlistBuddy -c "Add :objects:$TARGET_KEY:buildSettings:IPHONEOS_DEPLOYMENT_TARGET string ${{ env.IOS_DEPLOYMENT_TARGET }}" ios/Runner.xcodeproj/project.pbxproj
          fi

          # 4. Verification
          echo "=== Deployment Targets ==="
          grep "platform :ios" ios/Podfile
          plutil -p ios/Runner/Info.plist | grep MinimumOSVersion
          xcodebuild -project ios/Runner.xcodeproj -showBuildSettings | grep IPHONEOS_DEPLOYMENT_TARGET

      - name: Clean workspace
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Setup code signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_CONTENT: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          # Keychain setup
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$CERTIFICATE_CONTENT" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

          # Install provisioning profile
          echo "$PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i profile.mobileprovision))
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          rm -f profile.mobileprovision

      - name: Build IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="ConstructionProfitCalculatorProvisionProfile"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -rf ~/Library/Developer/Xcode/DerivedData
