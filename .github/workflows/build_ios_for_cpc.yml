name: Build and Upload iOS IPA to App Store Connect
on:
  workflow_dispatch:
jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
      - name: Install dependencies
        run: flutter pub get --verbose > pub_get_log.txt 2>&1
      - name: Setup Ruby and CocoaPods
        run: |
          echo "Installing Ruby and CocoaPods..."
          sudo gem install activesupport -v 7.0.8
          sudo gem install cocoapods -v 1.15.2
          pod setup
          export LANG=en_US.UTF-8
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod --version
          pod deintegrate || true
          pod cache clean --all || true
          touch pod_install_log.txt
          pod install --repo-update --verbose >> pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..
          cat ios/pod_install_log.txt
      - name: Install iOS runtime
        run: |
          xcodebuild -downloadPlatform iOS || true
      - name: Verify ExportOptions.plist
        run: |
          if [ ! -f ios/ExportOptions.plist ]; then
            echo "Error: ios/ExportOptions.plist not found"
            exit 1
          fi
          plutil -lint ios/ExportOptions.plist || { echo "Error: Invalid ExportOptions.plist"; exit 1; }
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain || echo "Keychain creation failed, continuing..."
          security set-keychain-settings -lut 21600 build.keychain || true
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain || true
          security default-keychain -s build.keychain || true
      - name: Import Apple certificate
        env:
          IOS_DISTRIBUTION_P12_V2: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD_V2: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_P12_V2" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD_V2" -T /usr/bin/codesign || { echo "Certificate import failed"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain || true
          security find-identity -v -p codesigning build.keychain | grep "iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)" || { echo "Certificate not found in keychain"; exit 1; }
      - name: Install and verify provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_V2: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_V2" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ConstructionProfitCalculatorProvisionProfile.mobileprovision
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/ConstructionProfitCalculatorProvisionProfile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" profile.plist | grep AHVM2Z8TDL || { echo "Provisioning profile team ID mismatch"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist | grep com.tech4dev.constructionprofitcalculator || { echo "Provisioning profile bundle ID mismatch"; exit 1; }
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Clean Xcode project
        run: |
          cd ios
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release || { echo "Xcode clean failed"; exit 1; }
          cd ..
      - name: Build IPA
        run: |
          export FLUTTER_XCODE_CODE_SIGN_STYLE="Manual"
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY="iPhone Distribution: Alireza Ehiaei (AHVM2Z8TDL)"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="ConstructionProfitCalculatorProvisionProfile"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="AHVM2Z8TDL"
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --no-codesign \
            --verbose > build_ipa_log.txt 2>&1 || { cat build_ipa_log.txt; exit 1; }
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates >> build_ipa_log.txt 2>&1 || { cat build_ipa_log.txt; grep -i "error:" build_ipa_log.txt; exit 1; }
          ls -l build/ios/ipa/ || echo "IPA directory not found"
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa
          cat build_ipa_log.txt
      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install Fastlane
        run: gem install fastlane
      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << 'EOL'
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/construction_profit_calculator_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false,
                run_precheck_before_submit: false,
                verbose: true
              )
            end
          end
          EOL
      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          fastlane ios upload_to_app_store_connect --verbose > fastlane_log.txt 2>&1 || { cat fastlane_log.txt; exit 1; }
          cat fastlane_log.txt
      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            pub_get_log.txt
            pod_install_log.txt
            build_ipa_log.txt
            fastlane_log.txt
            fastlane/report.xml
            app-ipa/*.ipa
      - name: Clean up keychain with logs
        if: always()
        run: |
          echo "Listing all keychains:"
          security list-keychains
          echo "Attempting to delete 'build.keychain'..."
          security delete-keychain build.keychain || { echo "Keychain 'build.keychain' does not exist or could not be deleted."; true; }
          echo "Keychain cleanup complete."
