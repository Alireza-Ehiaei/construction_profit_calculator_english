name: Build and Upload iOS IPA to App Store Connect
on:
  workflow_dispatch:
jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64
      
      - name: Install dependencies
        run: flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }
      
      - name: Check Xcode version and SDKs
        run: |
          xcodebuild -version > xcode_info.txt
          xcodebuild -showsdks >> xcode_info.txt
          cat xcode_info.txt
      
      - name: Fix iOS SDK targeting in project files
        run: |
          cd ios
          echo "=== Checking for iOS 18.0 references ==="
          if grep -q "SDKROOT = iphoneos18.0" Runner.xcodeproj/project.pbxproj; then
            echo "Fixing SDKROOT from iphoneos18.0 to iphoneos"
            sed -i '' 's/SDKROOT = iphoneos18.0;/SDKROOT = iphoneos;/g' Runner.xcodeproj/project.pbxproj
          fi
          echo "=== Current deployment settings ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET\|SDKROOT" Runner.xcodeproj/project.pbxproj
          cd ..
      
      - name: Fix Main.storyboard iOS deployment target
        run: |
          cd ios
          if [ -f "Runner/Base.lproj/Main.storyboard" ]; then
            echo "Fixing Main.storyboard deployment target from 18.0 to 15.0"
            cp Runner/Base.lproj/Main.storyboard Runner/Base.lproj/Main.storyboard.backup
            sed -i '' 's/minimumSystemVersion="18.0"/minimumSystemVersion="15.0"/g' Runner/Base.lproj/Main.storyboard
            sed -i '' 's/targetRuntime="iOS.CocoaTouch" version="18.0"/targetRuntime="iOS.CocoaTouch" version="15.0"/g' Runner/Base.lproj/Main.storyboard
            sed -i '' 's/Development Assets"/Development Assets" version="15.0"/g' Runner/Base.lproj/Main.storyboard
            echo "Main.storyboard iOS target fixed to 15.0"
          else
            echo "Main.storyboard not found, skipping fix"
          fi
          cd ..
      
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..
      
      - name: Clean Xcode project
        run: |
          cd ios
          xcodebuild clean -workspace Runner.xcworkspace -scheme Runner -configuration Release > xcode_clean_log.txt 2>&1 || { cat xcode_clean_log.txt; exit 1; }
          cd ..
      
      - name: Force Xcode to use available iOS SDK
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
      
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
      
      - name: Import Apple certificate
        env:
          IOS_DISTRIBUTION_P12_V2: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD_V2: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_P12_V2" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD_V2" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain > dist_cert_list.txt
          grep "AHVM2Z8TDL" dist_cert_list.txt || { echo "Certificate import failed"; exit 1; }
      
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_V2: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_V2" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/f3f032ee-4fa9-4a39-8d91-f1d689df2e2c.mobileprovision
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Completely remove iOS 18.0 references from Main.storyboard
        run: |
          cd ios
          if [ -f "Runner/Base.lproj/Main.storyboard" ]; then
            echo "Completely removing iOS 18.0 references from Main.storyboard..."
            
            # Backup the original file
            cp Runner/Base.lproj/Main.storyboard Runner/Base.lproj/Main.storyboard.backup
            
            # Remove ALL iOS version specific references
            sed -i '' 's/iosVersion="[0-9.]*"//g' Runner/Base.lproj/Main.storyboard
            sed -i '' 's/version="[0-9.]*"//g' Runner/Base.lproj/Main.storyboard
            sed -i '' 's/minimumSystemVersion="[0-9.]*"//g' Runner/Base.lproj/Main.storyboard
            sed -i '' 's/targetRuntime="iOS.CocoaTouch" version="[0-9.]*"/targetRuntime="iOS.CocoaTouch"/g' Runner/Base.lproj/Main.storyboard
            
            # Remove any development assets version tags
            sed -i '' 's/Development Assets" version="[0-9.]*"/Development Assets"/g' Runner/Base.lproj/Main.storyboard
            
            echo "Main.storyboard cleaned of iOS version references"
            echo "Current storyboard content:"
            grep -n "iOS\\|version\\|targetRuntime" Runner/Base.lproj/Main.storyboard || echo "No iOS version references found"
          else
            echo "Main.storyboard not found"
          fi
          cd ..

      - name: Verify Main.storyboard is clean
        run: |
          cd ios
          if [ -f "Runner/Base.lproj/Main.storyboard" ]; then
            echo "=== Verifying Main.storyboard is clean ==="
            if grep -q "18.0" Runner/Base.lproj/Main.storyboard; then
              echo "ERROR: iOS 18.0 references still found in Main.storyboard:"
              grep -n "18.0" Runner/Base.lproj/Main.storyboard
              exit 1
            else
              echo "✓ Main.storyboard is clean of iOS 18.0 references"
            fi
          fi
          cd ..
    
      - name: Build IPA with Flutter (simplified)
        run: |
          # Use Flutter's build system now that iOS 18.0 issues are fixed
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --verbose > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa
      
      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install Fastlane
        run: gem install fastlane
      
      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << 'EOL'
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/construction_profit_calculator_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false
              )
            end
          end
          EOL
      
      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: fastlane ios upload_to_app_store_connect > fastlane_log.txt 2>&1 || { cat fastlane_log.txt | grep -i "error:"; exit 1; }
      
      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            pub_get_log.txt
            xcode_info.txt
            pod_install_log.txt
            xcode_clean_log.txt
            build_log.txt
            fastlane_log.txt
            fastlane/report.xml
            app-ipa/*.ipa
      
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
