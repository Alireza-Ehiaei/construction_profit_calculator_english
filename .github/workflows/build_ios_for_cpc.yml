
name: Build and Upload iOS IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          architecture: arm64

      - name: Install dependencies
        run: flutter pub get > pub_get_log.txt 2>&1 || { cat pub_get_log.txt; exit 1; }

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update > pod_install_log.txt 2>&1 || { cat pod_install_log.txt; exit 1; }
          cd ..

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

      - name: Import Apple development certificate
        env:
          IOS_DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
          CERTIFICATE_PASSWORD_V2: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DEVELOPMENT_P12" | base64 --decode > development_certificate.p12
          ls -l development_certificate.p12
          file development_certificate.p12
          security import development_certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD_V2" -T /usr/bin/codesign || { echo "Failed to import development certificate"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain || { echo "Failed to set key partition list"; exit 1; }
          security find-identity -v -p codesigning build.keychain > cert_list.txt
          cat cert_list.txt
          grep "AHVM2Z8TDL" cert_list.txt || { echo "Development certificate import failed or team ID not found"; exit 1; }

      - name: Import Apple distribution certificate
        env:
          IOS_DISTRIBUTION_P12_V2: ${{ secrets.IOS_DISTRIBUTION_P12_V2 }}
          CERTIFICATE_PASSWORD_V2: ${{ secrets.CERTIFICATE_PASSWORD_V2 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_DISTRIBUTION_P12_V2" | base64 --decode > certificate.p12
          ls -l certificate.p12
          file certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD_V2" -T /usr/bin/codesign || { echo "Failed to import distribution certificate"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain || { echo "Failed to set key partition list"; exit 1; }
          security find-identity -v -p codesigning build.keychain > dist_cert_list.txt
          cat dist_cert_list.txt
          grep "AHVM2Z8TDL" dist_cert_list.txt || { echo "Distribution certificate import failed or team ID not found"; exit 1; }

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_V2: ${{ secrets.IOS_PROVISIONING_PROFILE_V2 }}
        run: |
          echo "$IOS_PROVISIONING_PROFILE_V2" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/f3f032ee-4fa9-4a39-8d91-f1d689df2e2c.mobileprovision
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-tree-shake-icons \
            --verbose > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          mkdir -p app-ipa
          cp build/ios/ipa/*.ipa app-ipa/construction_profit_calculator_english.ipa

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Set up Fastlane configuration
        run: |
          mkdir -p ./fastlane
          cat > ./fastlane/Fastfile << 'EOL'
          default_platform(:ios)
          platform :ios do
            lane :upload_to_app_store_connect do
              app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: ENV["APP_STORE_CONNECT_KEY_CONTENT"],
                is_key_content_base64: true
              )
              deliver(
                ipa: "./app-ipa/construction_profit_calculator_english.ipa",
                skip_screenshots: true,
                skip_metadata: true,
                skip_app_version_update: true,
                force: true,
                precheck_include_in_app_purchases: false
              )
            end
          end
          EOL

      - name: Run Fastlane to upload IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: fastlane ios upload_to_app_store_connect > fastlane_log.txt 2>&1 || { cat fastlane_log.txt | grep -i "error:"; exit 1; }

      - name: Upload build log and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-ipa
          path: |
            pub_get_log.txt
            pod_install_log.txt
            cert_list.txt
            dist_cert_list.txt
            build_log.txt
            fastlane_log.txt
            fastlane/report.xml
            app-ipa/*.ipa

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
